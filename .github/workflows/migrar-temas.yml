# FASE 3 da spec de temas (24/08) — migração/reclassificação do acervo.
# SÓ dispatch manual; DRY-RUN por padrão; idempotente (versao_taxonomia).
# MODO mapear = ZERO custo de IA (só sinônimos). MODO completo usa Haiku
# (~US$0,001/artigo) para quem não mapear + assistiva de temas adicionais.
# NÃO RODAR antes de o diagnóstico (workflow "Diagnostico de Temas") ser
# confirmado pelo fundador.

name: Migrar Temas (Fase 3)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = só relatar; false = gravar'
        required: false
        default: 'true'
      modo:
        description: 'mapear (zero IA) ou completo (IA p/ sem-mapa + assistiva)'
        required: false
        default: 'mapear'
      limit:
        description: 'teto de artigos processados neste run'
        required: false
        default: '500'
      especialidade:
        description: 'opcional: migrar só uma especialidade'
        required: false
        default: ''

jobs:
  migrar:
    name: Migrar temas do acervo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Migrar
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN:             ${{ inputs.dry_run }}
          MODO:                ${{ inputs.modo }}
          LIMIT:               ${{ inputs.limit }}
          ESPECIALIDADE:       ${{ inputs.especialidade }}
        run: node scripts/migrar-temas.js
