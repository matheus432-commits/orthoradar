# Fase 4 da spec de temas (24/08): teste automatizado que FALHA se algum
# artigo do banco tiver tema fora da taxonomia canônica. SÓ leitura, zero IA.
# Dispatch manual (rodar após a migração e quando quiser conferir).

name: Validar Temas do Acervo

on:
  workflow_dispatch:

jobs:
  validar:
    name: Integridade dos temas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar (falha em qualquer violação)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/validar-temas-acervo.js
