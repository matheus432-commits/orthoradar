# Backfill de terminologia no acervo (pedido do fundador 08/08):
# "Distanciamento" → "Distalização" em títulos, resumos, roteiros e digests.
# SÓ manual (workflow_dispatch), sem custo de IA/TTS — replace determinístico
# via corrigirTermosBR nos docs já publicados. O áudio narrado não muda.

name: Corrigir Terminologia (Distalização)

on:
  workflow_dispatch:

jobs:
  corrigir:
    name: Backfill distanciamento → distalização
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Corrigir acervo
        env:
          FIREBASE_PROJECT_ID:      ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY:         ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/corrigir-terminologia.js
