name: Acervo Probe (artigos/áudios)

# Sondagem sob demanda: conta artigos, edições, episódios e itens de biblioteca.
# SÓ leitura agregada (COUNT no servidor) — sem IA, sem TTS, custo ~zero.
# Sem cron de propósito (diretriz 30/07: nenhuma execução automática nova).

on:
  workflow_dispatch:

jobs:
  probe:
    name: Contar acervo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar sondagem do acervo
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY:    ${{ secrets.FIREBASE_API_KEY }}
        run: node scripts/acervo-probe.js
