<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferramentas — Hub por especialidade · OdontoFeed (protótipo)</title>
<!--
  DIRETRIZ DE ESTÉTICA OdontoFeed (fundador, 27/07) — vale para TODAS as abas:
  · sem emojis ao lado dos títulos (texto limpo);
  · nada de negrito muito pesado / preto chapado (dá ar infantil);
  · pesos de fonte leves (400–500), cor de texto suavizada (grafite, não preto),
    bastante respiro, filetes finos. Ar sério, editorial, profissional.
-->
<style>
:root{
  --papel:#FBFAF7; --carta:#FFFFFF; --grafite:#2E3440; --texto:#3C4250;
  --suave:#8A8F9C; --linha:#ECEAE3; --ouro:#B9982E; --sel:#5B6BA8;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--papel);color:var(--texto);font-family:var(--sans);line-height:1.55;
  -webkit-font-smoothing:antialiased;letter-spacing:.1px}
.pagina{max-width:660px;margin:0 auto;padding:34px 20px 64px}

.selo{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;
  color:var(--suave);margin-bottom:14px}
h1{font-family:var(--serif);font-size:clamp(26px,6vw,34px);font-weight:400;
  letter-spacing:.2px;color:var(--grafite)}
.sub{color:var(--suave);font-size:14.5px;margin-top:9px;max-width:52ch;font-weight:400}
.filete{height:1px;width:100%;background:var(--linha);margin:22px 0 26px}

/* ── Ferramenta transversal (topo) ─────────────────────────────────────────── */
.geral{display:flex;align-items:center;gap:12px;padding:16px 18px;margin-bottom:30px;
  background:var(--carta);border:1px solid var(--linha);border-left:2px solid var(--ouro);
  border-radius:8px;text-decoration:none;color:inherit;transition:border-color .15s}
.geral:hover{border-color:var(--suave)}
.g-tit{font-size:15px;font-weight:500;color:var(--grafite)}
.g-desc{font-size:12.5px;color:var(--suave);margin-top:1px}
.g-seta{margin-left:auto;font-size:17px;color:var(--suave);font-weight:300}

/* ── Seletor de especialidade ──────────────────────────────────────────────── */
.rot{font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--suave);margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:30px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:transparent;
  border:1px solid var(--linha);border-radius:999px;padding:9px 16px;cursor:pointer;
  font-family:inherit;font-size:13.5px;font-weight:400;color:var(--texto);transition:.15s}
.chip:hover{border-color:var(--suave)}
.chip.ativo{border-color:var(--cor);color:var(--grafite);
  background:color-mix(in srgb,var(--cor) 5%,white)}
.chip-dot{width:7px;height:7px;border-radius:50%;background:var(--cor);flex:0 0 auto}

/* ── Cabeçalho da lista ────────────────────────────────────────────────────── */
.lista-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.lc-tit{font-family:var(--serif);font-size:19px;font-weight:400;color:var(--grafite)}
.lc-qt{margin-left:auto;font-size:12px;color:var(--suave)}

/* ── Lista de títulos (limpa, sem emoji) ───────────────────────────────────── */
.lista{margin-top:10px;border-top:1px solid var(--linha)}
.linha{display:flex;align-items:center;gap:14px;padding:17px 4px;cursor:pointer;
  text-decoration:none;color:inherit;border-bottom:1px solid var(--linha);
  transition:padding-left .15s}
.linha:hover{padding-left:10px}
.linha.soon{cursor:default}
.linha.soon:hover{padding-left:4px}
.li-tit{flex:1;min-width:0;font-size:15.5px;font-weight:400;color:var(--grafite)}
.linha.soon .li-tit{color:var(--suave)}
.li-tipo{font-size:11px;color:var(--suave);flex:0 0 auto;letter-spacing:.3px}
.li-seta{font-size:17px;color:var(--sel);flex:0 0 auto;font-weight:300}
.li-soon{font-size:11px;color:var(--suave);flex:0 0 auto;letter-spacing:.4px}

.marca{margin-top:38px;text-align:center;font-size:11.5px;color:var(--suave);letter-spacing:.3px}
.marca b{color:var(--texto);font-weight:600}.marca .p{color:var(--ouro)}
</style>
</head>
<body>
<div class="pagina">

  <div class="selo">Área de membro</div>
  <h1>Ferramentas</h1>
  <p class="sub">Guias clínicos e ferramentas de decisão das suas especialidades.</p>
  <div class="filete"></div>

  <!-- Ferramenta transversal, fixada no topo -->
  <a class="geral" href="ferramenta-prescricao-segura.html">
    <span><span class="g-tit">Prescrição Segura</span>
    <div class="g-desc">Para todas as especialidades</div></span>
    <span class="g-seta">›</span>
  </a>

  <div class="rot">Suas especialidades</div>
  <div class="chips" id="chips"></div>

  <div class="lista-cab">
    <span class="lc-tit" id="lcTit"></span>
    <span class="lc-qt" id="lcQt"></span>
  </div>
  <div class="lista" id="lista"></div>

  <div class="marca"><b>Odonto<span class="p">Feed</span></b> · protótipo do hub (não publicado)</div>
</div>

<script>
// As 3 especialidades que ESTE dentista escolheu no perfil (exemplo).
const PERFIL = ['orto', 'implanto', 'endo'];

const ESP = {
  orto:     { nome:'Ortodontia',     cor:'#5B6BA8' },
  implanto: { nome:'Implantodontia', cor:'#3E8F86' },
  endo:     { nome:'Endodontia',     cor:'#B08a3a' },
};

// Catálogo por especialidade — guias e ferramentas na MESMA lista.
// href presente = página pronta (protótipo).
const CATALOGO = {
  orto: [
    { t:'Guia de Cefalometria', tipo:'Guia', href:'guia-cefalometria-preview.html' },
    { t:'Aparelhos Ortopédicos Funcionais', tipo:'Ferramenta', href:'ferramenta-aparelhos-ortopedicos.html' },
    { t:'Análise de Bolton', tipo:'Ferramenta', href:'ferramenta-bolton.html' },
    { t:'Classificação de Angle', tipo:'Guia', href:'guia-angle.html' },
    { t:'Cronologia de erupção e interceptação', tipo:'Guia' },
    { t:'Guia de contenção', tipo:'Guia' },
  ],
  implanto: [
    { t:'Protocolo de carga (imediata, precoce, tardia)', tipo:'Ferramenta', href:'ferramenta-carga-implante.html' },
    { t:'Enxertos e biomateriais', tipo:'Ferramenta' },
    { t:'Qualidade óssea (Lekholm & Zarb)', tipo:'Guia' },
    { t:'Checklist de planejamento em tomografia', tipo:'Guia' },
    { t:'Mucosite e peri-implantite', tipo:'Guia' },
  ],
  endo: [
    { t:'Diagnóstico pulpar e periapical', tipo:'Ferramenta', href:'ferramenta-diagnostico-pulpar.html' },
    { t:'Medicação intracanal', tipo:'Ferramenta' },
    { t:'Protocolos de irrigação', tipo:'Guia' },
    { t:'Trauma dentário (IADT)', tipo:'Guia' },
    { t:'Anestesia na pulpite irreversível', tipo:'Ferramenta' },
    { t:'Retratamento ou cirurgia parendodôntica', tipo:'Guia' },
  ],
  perio: [
    { t:'Estadiamento e graduação (2018)', tipo:'Ferramenta', href:'ferramenta-perio-2018.html' },
    { t:'Sondagem e periograma', tipo:'Guia' },
    { t:'Recessões (Cairo) e recobrimento', tipo:'Guia' },
    { t:'Raspagem ou cirurgia', tipo:'Guia' },
  ],
  buco: [
    { t:'Terceiros molares inferiores', tipo:'Ferramenta', href:'ferramenta-terceiros-molares.html' },
    { t:'Paciente anticoagulado', tipo:'Ferramenta' },
    { t:'Protocolo MRONJ', tipo:'Guia' },
    { t:'Sinais radiográficos de fratura', tipo:'Guia' },
  ],
  odontoped: [
    { t:'Calculadoras pediátricas', tipo:'Ferramenta', href:'ferramenta-calc-pediatrica.html' },
    { t:'Cronologia de erupção', tipo:'Guia' },
    { t:'Trauma em decíduos (IADT)', tipo:'Guia' },
    { t:'Flúor por idade', tipo:'Guia' },
  ],
  dentistica: [
    { t:'Seleção de resina', tipo:'Ferramenta', href:'ferramenta-resina.html' },
    { t:'Protocolos adesivos', tipo:'Guia' },
    { t:'Clareamento e sensibilidade', tipo:'Guia' },
    { t:'Escala de cor na prática', tipo:'Guia' },
  ],
  protese: [
    { t:'Assistente de cimentação', tipo:'Ferramenta', href:'ferramenta-cimentacao.html' },
    { t:'Coroa, onlay ou faceta', tipo:'Guia' },
    { t:'Términos e preparos', tipo:'Guia' },
    { t:'Zircônia, dissilicato ou híbridas', tipo:'Guia' },
  ],
  dtm: [
    { t:'Seleção de placa', tipo:'Ferramenta', href:'ferramenta-placa-dtm.html' },
    { t:'Diagnóstico diferencial da dor', tipo:'Guia' },
    { t:'Exame DC/TMD guiado', tipo:'Guia' },
  ],
  radiologia: [
    { t:'Qual exame pedir', tipo:'Ferramenta', href:'ferramenta-exame-radiologico.html' },
    { t:'Radiolúcidas × radiopacas', tipo:'Guia' },
    { t:'Anatomia radiográfica que engana', tipo:'Guia' },
  ],
  estomato: [
    { t:'Da lesão à conduta', tipo:'Ferramenta', href:'ferramenta-lesao-mucosa.html' },
    { t:'Rastreio de câncer bucal', tipo:'Guia' },
    { t:'Biópsia: quando e como', tipo:'Guia' },
  ],
};

let atual = PERFIL[0];

function renderChips() {
  document.getElementById('chips').innerHTML = PERFIL.map(id => {
    const e = ESP[id];
    return `<button class="chip ${id===atual?'ativo':''}" style="--cor:${e.cor}" onclick="selecionar('${id}')">
      <span class="chip-dot" style="--cor:${e.cor}"></span>${e.nome}</button>`;
  }).join('');
}

function renderLista() {
  const e = ESP[atual], itens = CATALOGO[atual];
  document.documentElement.style.setProperty('--sel', e.cor);
  document.getElementById('lcTit').textContent = e.nome;
  document.getElementById('lcQt').textContent = itens.length + ' itens';

  const linha = (it) => {
    if (it.href) {
      return `<a class="linha" href="${it.href}">
        <span class="li-tit">${it.t}</span>
        <span class="li-tipo">${it.tipo}</span>
        <span class="li-seta">›</span></a>`;
    }
    return `<div class="linha soon">
      <span class="li-tit">${it.t}</span>
      <span class="li-soon">em breve</span></div>`;
  };

  document.getElementById('lista').innerHTML = itens.map(linha).join('');
}

function selecionar(id){ atual = id; renderChips(); renderLista(); window.scrollTo({top:0,behavior:'smooth'}); }

renderChips();
renderLista();
</script>
</body>
</html>
