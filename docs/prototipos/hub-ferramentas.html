<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferramentas — Hub por especialidade · OdontoFeed (protótipo)</title>
<style>
:root{
  --papel:#F8F5EF; --carta:#FFFFFF; --tinta:#1B2440; --tinta-suave:#5B6478;
  --ouro:#C9A227; --borda:#E7E2D6; --raio:18px;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font-family:var(--sans);line-height:1.5;
  -webkit-font-smoothing:antialiased}
.pagina{max-width:720px;margin:0 auto;padding:26px 16px 60px}

.selo{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:800;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:12px}
.selo::before{content:'🛠️';font-size:15px}
h1{font-family:var(--serif);font-size:clamp(27px,6vw,38px);font-weight:700;letter-spacing:-0.5px}
.sub{color:var(--tinta-suave);font-size:14.5px;margin-top:8px;max-width:52ch}
.filete{height:3px;width:56px;border-radius:2px;margin:18px 0 22px;
  background:linear-gradient(90deg,var(--ouro),var(--sel,#6D8BFF));transition:background .25s}

/* ── Seletor de especialidade (as 3 do perfil) ─────────────────────────────── */
.rot-sel{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--tinta-suave);margin-bottom:10px}
.chips{display:flex;gap:9px;overflow-x:auto;padding-bottom:4px;margin-bottom:26px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:var(--carta);
  border:1.5px solid var(--borda);border-radius:14px;padding:11px 16px 11px 12px;cursor:pointer;
  font-family:inherit;transition:.15s}
.chip:hover{border-color:var(--cor)}
.chip.ativo{border-color:var(--cor);background:color-mix(in srgb,var(--cor) 9%,white);
  box-shadow:0 8px 20px color-mix(in srgb,var(--cor) 22%,transparent)}
.chip-dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--cor) 16%,white);font-size:15px;flex:0 0 auto}
.chip-nome{font-size:13.5px;font-weight:800;color:var(--tinta)}
.chip-qt{font-size:11px;color:var(--tinta-suave)}

/* ── Cabeçalho da lista ────────────────────────────────────────────────────── */
.lista-cab{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.lc-bola{width:12px;height:12px;border-radius:50%;background:var(--sel)}
.lc-tit{font-family:var(--serif);font-size:20px;font-weight:700}
.lc-qt{margin-left:auto;font-size:12px;color:var(--tinta-suave);font-weight:600}

.grupo-rot{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--tinta-suave);margin:18px 2px 9px}

/* ── Linha vertical (uma solução) ──────────────────────────────────────────── */
.linha{display:flex;align-items:center;gap:14px;background:var(--carta);border:1px solid var(--borda);
  border-radius:14px;padding:15px 16px;margin-bottom:10px;cursor:pointer;text-decoration:none;
  color:inherit;transition:.15s;position:relative}
.linha:hover{border-color:var(--sel);transform:translateX(2px);
  box-shadow:0 8px 22px rgba(27,36,64,.07)}
.linha.soon{cursor:default;opacity:.72}
.linha.soon:hover{transform:none;border-color:var(--borda);box-shadow:none}
.li-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:21px;
  flex:0 0 auto;background:color-mix(in srgb,var(--sel) 12%,white)}
.li-meio{flex:1;min-width:0}
.li-tit{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.li-desc{font-size:12.7px;color:var(--tinta-suave);margin-top:2px}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.guia{background:#EEF2FF;color:#4A66D4}
.tag.ferramenta{background:#E7F5EE;color:#1F7A50}
.tag.pronto{background:#FCF4DC;color:#8a6d10}
.li-seta{font-size:20px;color:var(--sel);flex:0 0 auto}
.li-soon{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--tinta-suave);background:var(--papel);padding:4px 9px;border-radius:999px;flex:0 0 auto}

/* ── Faixa de ferramenta geral (transversal) ───────────────────────────────── */
.geral{background:linear-gradient(180deg,#1B2440,#141B31);color:#fff;border-radius:var(--raio);
  padding:16px 18px;margin-bottom:26px;display:flex;align-items:center;gap:14px;
  text-decoration:none}
.geral .g-ico{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.1);
  display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.geral .g-tit{font-size:14.5px;font-weight:800}
.geral .g-desc{font-size:12px;opacity:.72;margin-top:1px}
.geral .g-seta{margin-left:auto;font-size:20px;color:#F3D577}

.marca{margin-top:32px;text-align:center;font-size:12px;color:var(--tinta-suave)}
.marca b{color:var(--tinta);font-weight:800}.marca .p{color:var(--ouro)}
</style>
</head>
<body>
<div class="pagina">

  <div class="selo">Área de membro</div>
  <h1>Ferramentas</h1>
  <p class="sub">Guias clínicos e ferramentas de decisão das suas especialidades,
  num lugar só.</p>
  <div class="filete" id="filete"></div>

  <!-- Ferramenta transversal, fixada no topo -->
  <a class="geral" href="ferramenta-prescricao-segura.html">
    <span class="g-ico">💊</span>
    <span><span class="g-tit">Prescrição Segura</span>
    <div class="g-desc">Para todas as especialidades · dose, posologia e receita</div></span>
    <span class="g-seta">→</span>
  </a>

  <div class="rot-sel">Suas especialidades</div>
  <div class="chips" id="chips"></div>

  <div class="lista-cab">
    <span class="lc-bola" id="lcBola"></span>
    <span class="lc-tit" id="lcTit"></span>
    <span class="lc-qt" id="lcQt"></span>
  </div>
  <div id="lista"></div>

  <div class="marca"><b>Odonto<span class="p">Feed</span></b> · protótipo do hub (não publicado)</div>
</div>

<script>
// As 3 especialidades que ESTE dentista escolheu no perfil (exemplo).
const PERFIL = ['orto', 'implanto', 'endo'];

const ESP = {
  orto:     { nome:'Ortodontia',      ico:'📐', cor:'#6D8BFF' },
  implanto: { nome:'Implantodontia',  ico:'🦿', cor:'#22D3C7' },
  endo:     { nome:'Endodontia',      ico:'🩹', cor:'#FFB020' },
};

// Catálogo por especialidade — guias e ferramentas na MESMA lista vertical.
// href presente = página pronta (protótipo); pronto:true realça a tag.
const CATALOGO = {
  orto: [
    { t:'Guia de Cefalometria', d:'Cada parâmetro (FMA, SNA, ANB…) com interpretação e conduta', tipo:'guia', pronto:true, href:'guia-cefalometria-preview.html' },
    { t:'Aparelhos Ortopédicos Funcionais', d:'Escolha o objetivo → aparelhos indicados com protocolo', tipo:'ferramenta', pronto:true, href:'ferramenta-aparelhos-ortopedicos.html' },
    { t:'Classificação de Angle', d:'Classe I/II/III visual + plano de tratamento por classe', tipo:'guia' },
    { t:'Análise de Bolton', d:'Discrepância de tamanho dentário com calculadora', tipo:'ferramenta' },
    { t:'Cronologia de erupção e interceptação', d:'Janelas ideais: tratar agora × monitorar', tipo:'guia' },
    { t:'Guia de contenção', d:'Qual contentor, quando e por quanto tempo', tipo:'guia' },
  ],
  implanto: [
    { t:'Carga imediata × precoce × tardia', d:'Fluxo de decisão por torque e ISQ', tipo:'guia' },
    { t:'Enxertos e biomateriais', d:'Defeito ósseo → técnica + biomaterial + tempo de espera', tipo:'ferramenta' },
    { t:'Qualidade óssea (Lekholm & Zarb)', d:'Classificação ilustrada e implicações clínicas', tipo:'guia' },
    { t:'Checklist de planejamento em tomografia', d:'O que medir e conferir antes de operar', tipo:'guia' },
    { t:'Mucosite × peri-implantite', d:'Diagnóstico diferencial e manejo', tipo:'guia' },
  ],
  endo: [
    { t:'Diagnóstico pulpar e periapical', d:'Testes, interpretação e nomenclatura correta', tipo:'guia' },
    { t:'Medicação intracanal', d:'Diagnóstico + nº de sessões → substância e tempo', tipo:'ferramenta' },
    { t:'Protocolos de irrigação comparados', d:'Soluções, concentrações e ativação', tipo:'guia' },
    { t:'Trauma dentário (IADT)', d:'Conduta ilustrada por tipo de trauma', tipo:'guia' },
    { t:'Anestesia na pulpite irreversível', d:'Técnicas suplementares quando o bloqueio falha', tipo:'ferramenta' },
    { t:'Retratamento × cirurgia parendodôntica', d:'Quando cada caminho', tipo:'guia' },
  ],
};

let atual = PERFIL[0];

function renderChips() {
  document.getElementById('chips').innerHTML = PERFIL.map(id => {
    const e = ESP[id], n = CATALOGO[id].length;
    return `<button class="chip ${id===atual?'ativo':''}" style="--cor:${e.cor}" onclick="selecionar('${id}')">
      <span class="chip-dot" style="--cor:${e.cor}">${e.ico}</span>
      <span><span class="chip-nome">${e.nome}</span><br><span class="chip-qt">${n} ferramentas</span></span>
    </button>`;
  }).join('');
}

function renderLista() {
  const e = ESP[atual], itens = CATALOGO[atual];
  document.documentElement.style.setProperty('--sel', e.cor);
  document.getElementById('filete').style.setProperty('--sel', e.cor);
  document.getElementById('lcBola').style.background = e.cor;
  document.getElementById('lcTit').textContent = e.nome;
  document.getElementById('lcQt').textContent = itens.length + ' ferramentas';

  const linha = (it) => {
    const tagTipo = it.tipo === 'guia'
      ? '<span class="tag guia">Guia</span>'
      : '<span class="tag ferramenta">Interativa</span>';
    const tagPronto = it.pronto ? '<span class="tag pronto">Disponível</span>' : '';
    if (it.href) {
      return `<a class="linha" href="${it.href}">
        <span class="li-ico">${it.tipo==='guia'?'📖':'🧰'}</span>
        <span class="li-meio"><span class="li-tit">${it.t} ${tagTipo}${tagPronto}</span>
          <div class="li-desc">${it.d}</div></span>
        <span class="li-seta">→</span></a>`;
    }
    return `<div class="linha soon">
      <span class="li-ico">${it.tipo==='guia'?'📖':'🧰'}</span>
      <span class="li-meio"><span class="li-tit">${it.t} ${tagTipo}</span>
        <div class="li-desc">${it.d}</div></span>
      <span class="li-soon">Em breve</span></div>`;
  };

  document.getElementById('lista').innerHTML = itens.map(linha).join('');
}

function selecionar(id){ atual = id; renderChips(); renderLista(); window.scrollTo({top:0,behavior:'smooth'}); }

renderChips();
renderLista();
</script>
</body>
</html>
