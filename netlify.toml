[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"

# ── Feed do podcast: URL pública limpa e estável (submetida ao Spotify) ───────
# Rewrite (status 200): o endereço permanece /podcast.xml para quem acessa,
# servido pela function podcast-rss (feed mestre). Se um dia a infra mudar, a
# URL registrada nos agregadores continua a mesma.
[[redirects]]
  from = "/podcast.xml"
  to = "/.netlify/functions/podcast-rss"
  status = 200

# ── Links curtos dos canais (ecossistema site ↔ Instagram ↔ Spotify) ─────────
# Todos os materiais (site, e-mail, bio do Instagram, descrição no Spotify)
# apontam para ESTES endereços — se o destino mudar, troca-se aqui, num lugar só.
[[redirects]]
  from = "/instagram"
  to = "https://www.instagram.com/odontofeedbr"
  status = 302

# Programa oficial no Spotify (aprovado e no ar em 20/07/2026).
[[redirects]]
  from = "/spotify"
  to = "https://open.spotify.com/show/033SQ8fzusV57wuFNGXtde"
  status = 302

# Página de preços: os planos vivem na home (#planos) — rota curta estável
# para materiais/links. (/biblioteca dispensa redirect: pretty URL do Netlify
# já serve biblioteca.html, como /dashboard.)
[[redirects]]
  from = "/precos"
  to = "/#planos"
  status = 302

# Endpoints admin das specs de 24/08 (diagnóstico/migração de temas e
# diagnóstico/backfill do pipeline) — caminho pedido na spec: /api/admin/*.
[[redirects]]
  from = "/api/admin/diagnostico-temas"
  to = "/.netlify/functions/diagnostico-temas"
  status = 200

[[redirects]]
  from = "/api/admin/migrar-temas"
  to = "/.netlify/functions/migrar-temas"
  status = 200

[[redirects]]
  from = "/api/admin/diagnostico-pipeline"
  to = "/.netlify/functions/diagnostico-pipeline"
  status = 200

[[redirects]]
  from = "/api/admin/backfill-biblioteca"
  to = "/.netlify/functions/backfill-biblioteca"
  status = 200

# Landing de resgate de parceria: /parceria/{slug} serve a página única, que
# lê o slug do próprio path (rewrite 200 — a URL bonita fica na barra).
[[redirects]]
  from = "/parceria/*"
  to = "/parceria.html"
  status = 200

[functions."cleanup-articles"]
  schedule = "0 3 * * 0"

# Afiliados: encerra comissões que cumpriram 12 meses (dia 1 de cada mês, 6h
# UTC = 3h BRT). O relatório também trata expirados na leitura — o job só
# materializa o estado (idempotente; resposta só com contadores).
[functions."afiliados-expiracao"]
  schedule = "0 6 1 * *"

# Parcerias: aviso de 7 dias e expiração dos 3 meses de cortesia (diária, 9h
# UTC = 6h BRT). Nunca cobra automaticamente — só avisa e rebaixa ao Gratuito
# quem veio de parceria; assinante pago vira "convertido" (protegido).
[functions."parcerias-expiracao"]
  schedule = "0 9 * * *"

# "O Que Ficou" — weekly top-articles recap: agendado via GitHub Actions
# (.github/workflows/weekly-digest.yml, sábado 11h UTC = 8h BRT) porque o envio
# percorre todos os usuários e não cabe no timeout de ~26s do Netlify.
# A função continua deployada apenas para disparo manual via HTTP.
[functions."weekly-digest"]
  node_bundler = "nft"

[functions."weekly-unsubscribe"]
  node_bundler = "nft"

